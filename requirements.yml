name: cytox
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # Core scientific / single-cell stack
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.15.3
      - anndata==0.11.4
      - scanpy==1.11.1
      # scGen / scvi-tools stack
      - scvi-tools==1.3.3
      - git+https://github.com/theislab/scgen.git
      # TF activity inference (the current dc.op / dc.mt API used by collecTRI.py)
      - decoupler==2.3.1
      # Project utilities
      - matplotlib>=3.8,<4
      - requests>=2.31
      - wandb>=0.17
      # Development / interactive work
      - pytest>=8
      - ipykernel>=6
      - jupyterlab>=4
